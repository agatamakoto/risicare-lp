<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Local Coworking Community</title>
<style>
:root{
  --bg:#12141a; --panel:#1a1d25; --panel2:#21252f; --line:#2e3340;
  --tx:#e8eaf0; --dim:#9aa2b4; --acc:#f0a848;
  --moon:#7aa7ff; --earth:#5fbf8f; --sun:#f0a848;
  --core:#f0a848; --mid:#7aa7ff; --edge:#8b93a6;
  --good:#5fbf8f; --bad:#e2686b; --warn:#e8b34a;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f5f8; --panel:#fff; --panel2:#eef0f5; --line:#dce0e8;
         --tx:#1c1f27; --dim:#68708a; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-text-size-adjust:100%}
#app{max-width:1140px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.02em}
p{margin:0 0 9px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);
  background:var(--panel2);border-radius:8px;padding:8px 12px;transition:.12s}
button:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
button:disabled{opacity:.35;cursor:not-allowed}
.pri{background:var(--acc);color:#12141a;border-color:var(--acc);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.col{flex:1 1 320px;min-width:0}
.dim{color:var(--dim)} .sm{font-size:12px} .xs{font-size:11px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel2);margin:1px 2px 1px 0;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}
#bar{position:sticky;top:0;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{display:flex;flex-direction:column;min-width:72px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.meter{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;border-radius:9px}
.zone{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.zone h4{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.06em}
.seats{display:flex;gap:6px;flex-wrap:wrap}
.seat{width:82px;height:62px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;
  cursor:pointer;padding:3px;text-align:center;line-height:1.3;overflow:hidden}
.seat.empty{opacity:.38;border-style:dashed}
.seat.sel{outline:2px solid var(--acc);outline-offset:1px}
.seat.match,.chip.match{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset;
  background:linear-gradient(180deg,rgba(95,191,143,.14),transparent)}
.seat{position:relative}
.spark{position:absolute;top:1px;right:3px;color:var(--good);font-size:12px;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.seat.tgt{border-color:var(--acc);background:rgba(240,168,72,.12)}
.seat b{font-size:11.5px;font-weight:700}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:3px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;
  padding:3px 9px;margin:2px;font-size:11.5px;background:var(--panel2);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.item{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;background:var(--panel2)}
.item.done{opacity:.42}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.opts button{font-size:12px;padding:5px 9px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.acts button{text-align:left;padding:8px 10px;font-size:12.5px}
.acts button i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px}
.sl{margin-bottom:9px}
.sl label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.sl input{width:100%;accent-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;
  align-items:center;justify-content:center;padding:14px;z-index:50}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;max-width:620px;width:100%;max-height:88vh;overflow:auto}
.bd{border-bottom:1px solid var(--line);padding:5px 0;display:flex;justify-content:space-between;gap:10px}
.bd:last-child{border:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mk{font-size:16px;font-weight:700;line-height:1}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pick{width:100%;text-align:left;margin-bottom:6px}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.note{background:var(--panel2);border-left:3px solid var(--acc);padding:9px 11px;border-radius:0 8px 8px 0;font-size:12.5px}
.tierbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);font-size:10.5px}
.tierbar div{display:flex;align-items:center;justify-content:center;color:#12141a;font-weight:700;min-width:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:9px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);cursor:pointer;text-align:left}
.vcard:hover{border-color:var(--acc)}
.vcard.on{border-color:var(--acc);background:rgba(240,168,72,.12)}
.vcard h3{font-size:14px;margin-bottom:4px}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;margin:10px 0}
.hc{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2)}
.hc .ic{font-size:26px;line-height:1.1}
.hc b{display:block;font-size:13.5px;margin:5px 0 3px}
.hc span{font-size:11.5px;color:var(--dim);line-height:1.5}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.flow .st{flex:1 1 130px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);text-align:center}
.flow .st .ic{font-size:24px}
.flow .st b{display:block;font-size:13px;margin-top:3px}
.flow .st span{font-size:11px;color:var(--dim)}
.arw{color:var(--dim);font-size:18px}
#flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:var(--bg);pointer-events:none;flex-direction:column;gap:6px}
#flash.on{display:flex;animation:fl 1.5s ease forwards}
#flash b{font-size:44px;letter-spacing:.06em}
#flash span{color:var(--dim);font-size:13px;letter-spacing:.2em}
@keyframes fl{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
#snd{position:fixed;right:12px;bottom:12px;z-index:30;font-size:12px;padding:6px 11px;
  border-radius:99px;background:var(--panel);opacity:.85}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"><b></b><span></span></div>
<button id="snd" onclick="toggleSound()">♪</button>
<div id="modal"><div id="mbox"></div></div>

function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}

function tone(f,t0,dur,type,vol){
  const a=ac(); if(!a||!SOUND)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime+t0);
  g.gain.setValueAtTime(0,a.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||0.07,a.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05);
}

function reseat(){
  S.members.forEach(m=>{ if(m.tier!=='core') m.seat=null; });
  const core=S.members.filter(m=>m.tier==='core').sort((a,b)=>b.belong-a.belong);
  const taken=new Set(core.filter(m=>m.seat).map(m=>m.seat));
  const zoneKeys=z=>{const o=[];const zz=ZONES.find(x=>x.id===z);for(let i=0;i<zz.seats;i++)o.push(z+':'+i);return o;};
  // 好みのゾーンは決まっているが、その中のどの席に座るかは日によって違う
  const sh=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
  const quietFirst=sh(zoneKeys('booth')).concat(sh(zoneKeys('desk')),sh(zoneKeys('isl')),sh(zoneKeys('big')));
  const socialFirst=sh(zoneKeys('big')).concat(sh(zoneKeys('isl')),sh(zoneKeys('desk')),sh(zoneKeys('booth')));
  core.forEach(m=>{ if(m.seat)return;

function adjacentPairs(){
  const out=[];
  ZONES.forEach(z=>{
    const st=[]; for(let i=0;i<z.seats;i++){const m=memberAt(z.id+':'+i); if(m)st.push({i,m});}
    if(z.adj==='all'){for(let a=0;a<st.length;a++)for(let b=a+1;b<st.length;b++)out.push([st[a].m,st[b].m]);}
    else if(z.adj==='line'){for(let i=0;i<z.seats-1;i++){const A=memberAt(z.id+':'+i),B=memberAt(z.id+':'+(i+1));if(A&&B)out.push([A,B]);}}
  }); return out;
}
function affinity(a,b){return GA[a.group][b.group]-0.6*Math.abs(a.tempo-b.tempo)-0.6*Math.abs(a.dist-b.dist);}

  const n=S.members.length; if(n<3)return 0;
  const r=k=>S.members.filter(m=>m.group===k).length/n;
  return 10-22*(Math.abs(r('moon')-1/3)+Math.abs(r('earth')-1/3)+Math.abs(r('sun')-1/3));

function skew(){

  const c={moon:0,earth:0,sun:0}; S.members.forEach(m=>c[m.group]++);
  for(const k in c) if(c[k]/n>=0.5)return k; return null;

  const pairs=adjacentPairs(); let ps=0;
  if(pairs.length) ps=(pairs.reduce((s,[a,b])=>s+affinity(a,b),0)/pairs.length)*3*amplify();
  const bal=balanceBonus(), n=Math.max(1,S.members.length);
  let load=0,gift=0; S.members.forEach(m=>m.traits.forEach(t=>{load+=TR[t].load;gift+=TR[t].gift;}));
  const tn=(gift-load)/n*6, rb=S.rules.length*1.5, dn=-(S.density-0.4)*22, ch=-S.chaos*1.4;
  const pj=S.projects?S.projects.length*2.2+Math.min(S.done,8)*1.1:0;
  const seats=seatList().length, used=S.members.filter(m=>m.seat).length;
  const full=used>=seats?-6:used>=seats-1?-2.5:0;   // 満席は落ち着かない

function matchScore(a,b){
  if(!a.want||!b.offer)return 0;
  const hit=a.want.need.filter(t=>b.offer.includes(t)).length;
  let p=0; a.traits.forEach(x=>b.traits.forEach(y=>{p+=(TR_PAIR[x]&&TR_PAIR[x][y])||0;}));
  return hit*4 + (affinity(a,b)>0?1:0) + (affinity(a,b)>1.5?1:0) + p;
}

function bestMatchFor(a){
  let best=null,bv=0;
  S.members.forEach(b=>{ if(b===a||b.inProject)return;
    const v=matchScore(a,b); if(v>bv){bv=v;best=b;} });
  return best?{m:best,v:bv}:null;
}

function wishMem(){return S.members.find(m=>m.revealed>=2&&!m.inProject)||S.members[0];}
function anyTrait(t){return S.members.some(m=>m.traits.includes(t)&&m.tier!=='edge');}
function tMem(t){return S.members.find(m=>m.traits.includes(t)&&m.tier!=='edge')||null;}
function tName(t){const m=tMem(t);return m?m.name:'誰か';}
function worstPair(){let w=null,v=99;adjacentPairs().forEach(([a,b])=>{const x=affinity(a,b);if(x<v){v=x;w=[a,b,x];}});return w;}
function bestPair(){return adjacentPairs().find(([a,b])=>affinity(a,b)>1.2)||null;}
function swapNear(a,b){
  if(!a.seat)return;
  const z=a.seat.split(':')[0],zz=ZONES.find(x=>x.id===z);
  for(let i=0;i<zz.seats;i++){const k=z+':'+i;if(!memberAt(k)){b.seat=k;return;}}
  const o=memberAt(z+':0');if(o&&o!==a){const t=b.seat;b.seat=o.seat;o.seat=t;}
}
function genCare(){
  // 作ったルールが片付けてくれている分は、もう出てこない
  const sup=new Set();
  S.rules.forEach(id=>{const r=RULES.find(x=>x.id===id); if(r)(r.sup||[]).forEach(s=>sup.add(s));});
  const pool=CARE.filter(c=>{ if(sup.has(c.id))return false;
    try{return c.if(S);}catch(e){return false;}});
  const n=cl(3+Math.floor(S.members.length/9)+(S.chaos?1:0),3,5);
  const out=[],used=new Set();
  for(let i=0;i<n&&pool.length;i++){
    const av=pool.filter(c=>!used.has(c.id)); if(!av.length)break;
    const c=wpick(av.map(x=>({w:x.w,x}))).x; used.add(c.id);
    out.push({id:c.id,t:(typeof c.t==='function'?c.t(S):c.t),warn:c.warn,o:c.o,done:false});
  }
  return out;
}

function fireIncident(){
  const av=INC.filter(c=>{if(S.fired['inc_'+c.id])return false;try{return c.if(S);}catch(e){return false;}});
  if(!av.length){S.incident=null;return;}
  const c=wpick(av.map(x=>({w:x.w,x}))).x; S.fired['inc_'+c.id]=1; S.incident=c;
}

/* ---------- 行動 ---------- */
function act(name){
  if(S.ap<=0&&name!=='rest'){toast('APが残っていません');return;}
  ({
    listen:()=>{const t=S.members.filter(m=>m.revealed<3);
      if(!t.length){toast('もう、みんなのことは聞きました');return;}
      choose('誰の話を聞きますか？',t,m=>{S.ap-=1;S.hp-=1;m.revealed++;m.belong+=9;m.cared=true;
        sfx('care');
        if(m.revealed===1)news(m.name+'と少し話した。どうやら'+G[m.group].n+'っぽい');
        if(m.revealed===2)news('◆ '+m.name+'は「'+m.want.t+'」と言っている');
        if(m.revealed===3)news('◆ '+m.name+'は'+(m.offer.length?m.offer.map(t=>OFFER[t]).join('、'):'特に何も持っていないと言う'));
        S.commons.bond+=1.2;render();});},
    connect:()=>{if(S.ap<2){toast('AP不足（2必要）');return;}
      const c=S.members.filter(m=>!m.inProject&&m.revealed>=2)
        .sort((x,y)=>hasMatch(y)-hasMatch(x));
      if(!c.length){toast('まだ誰の「やりたいこと」も分かっていません。\n先に「話を聞く」を2回してください');return;}
      choose('誰の「やりたいこと」を進めますか？',c,a=>{chooseMatch(a);});},
    support:()=>{if(!S.projects.length){toast('いま動いている企画はありません');return;}
      if(S.ap<2){toast('AP不足（2必要）');return;}
      chooseRaw('どの企画を後押ししますか？',S.projects.map(p=>({
        label:p.t, sub:p.an+'／'+p.bn+'　あと '+Math.max(0,p.need-p.prog)+' ヶ月', val:p})),
        p=>{S.ap-=2;S.hp-=2;p.prog+=1;sfx('good');    // その場で1ヶ月ぶん進む
          const left=Math.max(0,p.need-p.prog);
          news('「'+p.t+'」を後押しした　→ 残り '+left+' ヶ月'+(left===0?'（今月中に形になります）':''));
          render();});},
    sales:()=>{if(S.ap<2){toast('AP不足（2必要）');return;}
      S.ap-=2;S.hp-=2;S.marketing+=1.4;S.prospects+=ri(1,3);S.basics+=0.8;
      news('チラシを配り、商工会に顔を出した');render();},
    event:()=>{if(S.ap<2){toast('AP不足（2必要）');return;}
      const cands=S.members.filter(m=>m.tier!=='edge'&&(m.traits.includes('ikeike')||m.traits.includes('appr')||m.traits.includes('natsu')));
      const opts=[{label:'🙋 自分が企画して回す',sub:'AP3・体力4／確実にできる',val:'self'}];
      if(cands.length) opts.push({label:'🤝 '+cands[0].name+'に任せる',
        sub:'AP2・体力1／結束が薄いと失敗する。うまくいけば、その人が育つ',val:'host'});
      opts.push({label:'🍻 みんなで持ち寄りにする',sub:'AP2・体力2／小さいが、場が温まる',val:'pot'});
      chooseRaw('イベント、どうやりますか？',opts,how=>doEvent(how));},
    kodomo:()=>{if(!S.opt.kodomo){toast('こども食堂をやっていません');return;}
      if(S.ap<3){toast('AP不足（3必要）');return;}
      S.ap-=3;S.hp-=2;S.kodomoCount++;
      const att=ri(28,64),ad=Math.round(att*0.35);
      S.cash+=ad*S.price.kodomo;
      let food=att*180;
      if(S.stock.veg>0){S.stock.veg--;food-=att*90;news('  '+'野菜の差し入れで食材費が浮いた');}
      if(S.stock.rice>0){S.stock.rice--;food-=att*60;news('  寄付の米を使った');}
      S.cash-=Math.max(0,food);
      if(S.stock.vol>0){S.stock.vol--;S.hp+=2;news('  調理と片付けを手伝ってもらった');}else S.hp-=2;
      S.commons.bond+=3.2;S.commons.link+=2.6;S.commons.bridge+=1.4;
      S.members.filter(m=>m.tier!=='core').slice(0,4).forEach(m=>m.belong+=8);
      news('こども食堂'+S.kodomoCount+'回目：'+att+'人が来た');render();},
    rule:()=>{if(S.ap<2){toast('AP不足（2必要）');return;}
      const av=RULES.filter(r=>!S.rules.includes(r.id));
      if(!av.length){toast('もう作るルールがありません');return;}
      chooseRaw('どのルールを作りますか？',av.map(r=>({label:r.i+' '+r.n,
        sub:'◎ '+r.eff+(r.bad!=='—'?'　△ '+r.bad:'')+(r.cost?'　'+yen(r.cost):''),val:r})),
        r=>{ if(r.cost&&S.cash<r.cost){toast('現金が足りません');return;}
          S.ap-=2;S.hp-=1; if(r.cost)S.cash-=r.cost;
          S.rules.push(r.id); S.care=S.care.filter(c=>!(r.sup||[]).includes(c.id));
          sfx('good'); news('ルール「'+r.n+'」を作った');render();});},
    rest:()=>{if(S.ap<=0){toast('今月はもう休めません');return;}
      const g=6+S.ap*1.3, m=8+S.ap*1.7;
      S.hp=cl(S.hp+g,0,S.hpMax); S.mp=cl(S.mp+m,0,S.mpMax);
      S.ap=0;S.commons.bond-=1.4;
      news('休んだ。体力 +'+Math.round(g)+'、メンタル +'+Math.round(m));render();},
  }[name]||(()=>{}))();
  if(['sales','event','kodomo','rest'].includes(name))render();
}

/* ---------- 月送り ---------- */
function nextMonth(){
  document.getElementById('modal').classList.remove('on');
  if(!S.ended){ flash(S.month+'ヶ月目', MNAME[S.month]||''); setTimeout(render,420); }
  else { sfx(S.ended==='true'||S.ended==='vision'?'great':'bad'); render(); }
}
function doEvent(how){
  const base=[2,3,5,7,10,13,16,20][Math.min(7,S.eventStreak)];
  let att=base, ok=true;
  if(how==='self'){ S.ap-=3; S.hp-=4; att=Math.round(base*1.15); }
  else if(how==='host'){
    S.ap-=2; S.hp-=1;
    const h=S.members.filter(m=>m.tier!=='edge'&&(m.traits.includes('ikeike')||m.traits.includes('appr')||m.traits.includes('natsu')))[0];
    if(S.commons.bond>=26&&h){ att=Math.round(base*1.35); h.belong+=22; h.gt+=1; h.links++;
      S.commons.bond+=3; news('★ '+h.name+'が仕切ってくれた。あなたは受付にいただけ'); }
    else { ok=false; att=Math.round(base*0.4); S.hp-=3; S.commons.bond-=2;
      news('△ 任せてみたが、当日ほとんど回らなかった。結局こちらが動いた'); }
  } else { S.ap-=2; S.hp-=2; att=Math.round(base*0.8); S.commons.bond+=2.5;
    news('持ち寄りにした。料理が余った'); }
  if(S.opt.event) att=Math.round(att*1.4);
  if(S.rules.includes('r2')) att=Math.round(att*1.15);
  S.eventStreak++; S.eventCount++;
  S.cash+=att*1000;
  const j=S.members.filter(m=>m.tier!=='core').slice(0,Math.ceil(att*0.4));
  j.forEach(m=>{m.belong+=6;m.joined=true;});
  S.commons.bridge+=att*0.42; S.commons.bond+=att*0.18; S.prospects+=Math.max(0,Math.round(att/4));
  news('イベント'+S.eventStreak+'回目：参加'+att+'人。たまに来る人が'+j.length+'人、顔を出した');
  if(S.eventStreak===1)news('  1回目は、だいたいこんなものです');
  sfx(ok?'good':'bad'); render();
}
function tryEndMonth(){ sfx('tap'); fireIncident(); if(S.incident)showIncident(); else endMonth(); }
function showIncident(){
  const c=S.incident;
  modal(`<div class="dim sm">${S.month}ヶ月目 ── できごと</div>
   <h2 style="margin:5px 0 8px">${esc(c.t)}</h2><p class="sm">${esc(c.b)}</p><hr class="hr">
   ${c.o.map((o,i)=>`<button class="pick" onclick="resolveIncident(${i})">${esc(o.l)}</button>`).join('')}`);
}
function resolveIncident(i){
  const c=S.incident,r=c.o[i].f()||''; S.incident=null; sfx('tap');
  modal(`<div class="dim sm">${esc(c.t)}</div><h2 style="margin:6px 0 10px">${esc(c.o[i].l)}</h2>
    <div class="note">${esc(r)}</div>
    <div style="margin-top:16px"><button class="pri" style="width:100%;padding:11px" onclick="closeModal();endMonth()">月末へ ▶</button></div>`);
}

function endMonth(){
  const R={month:S.month,hp:[],mp:[],money:[]};
  let un=0; S.care.forEach(c=>{if(!c.done){un++;S.hp-=3;S.commons.bond-=4.5;}});
  if(un){R.hp.push({k:'放置した気配り（'+un+'件）',v:-3*un});
    S.mp-=5*un; R.mp.push({k:'拾えなかったことが、頭に残っている',v:-5*un});}
  const handled=S.care.filter(c=>c.done).length;
  if(handled){R.hp.push({k:'気配り（'+handled+'件対応）',v:0});
    S.mp-=handled*1.9; R.mp.push({k:'人に気を遣った（'+handled+'件）',v:-handled*1.9});}
  S.mp-=2.5; R.mp.push({k:'先が見えない',v:-2.5});
  const CM=comfort();R.comfort=CM;
  const T=tiers();

  let inc=0,exp=0;
  const pc=t=>T[t].filter(m=>m.pay!=='n'&&m.pay!=='c');
  const cL=pc('core'),core=cL.length,mid=pc('mid').length,edge=pc('edge').length;
  // コア層は使い放題プランに移る（払える範囲で、通常会費の2倍まで）
  const vC=cL.reduce((s,m)=>s+Math.min(m.budget,S.price.m*2),0);
  const vM=Math.round(mid*6.5*S.price.d),vE=Math.round(edge*1.5*S.price.d);
  inc+=vC+vM+vE;
  R.money.push({k:'コア層 '+core+'人（使い放題プラン）',v:vC});
  R.money.push({k:'中間層 '+mid+'人（都度）',v:vM});
  R.money.push({k:'周辺層 '+edge+'人',v:vE});
  if(S.corp){const v=S.corp*S.price.corp;inc+=v;R.money.push({k:'法人契約 '+S.corp+'社',v});}
  if(S.recur){inc+=S.recur;R.money.push({k:'ここから生まれた仕事の分け前',v:S.recur});}
  if(S.opt.virt&&S.virtN){const v=S.virtN*S.price.virt;inc+=v;R.money.push({k:'住所貸し '+S.virtN+'件',v});}
  if(S.opt.cafe){
    const g=Math.round((280+S.commons.bridge*6.4+legitimacy()*2.8-(S.price.cafe-500)*0.42)*0.75);
    const gr=Math.max(0,g)*S.price.cafe,cg=gr*0.30; inc+=gr;exp+=cg;
    R.money.push({k:'カフェ（'+Math.max(0,g)+'杯）',v:gr});
    R.money.push({k:'カフェ 原価',v:-cg});
  }
  if(S.opt.juku){
    S.jukuN=Math.min(24,S.jukuN+(Math.random()<0.7?1:0)+(legitimacy()>60?1:0));
    const v=S.jukuN*S.price.juku; inc+=v;
    R.money.push({k:'学習塾 '+S.jukuN+'人',v});
  }
  if(S.opt.guest){
    const occ=cl(0.16+S.commons.bridge/300+legitimacy()/380+rnd(-.07,.07),0.05,0.55);
    const nights=Math.round(3*30*occ*0.75), v=nights*S.price.guest; inc+=v;
    R.money.push({k:'ゲストハウス '+nights+'泊（稼働'+Math.round(occ*100)+'%・3室）',v});
  }
  if(S.opt.event){ const v=ri(2,6)*S.price.event*3; inc+=v; R.money.push({k:'イベント貸出',v}); }
  // 人が増えれば、人手も要る
  const staff=100000+Math.max(0,S.members.length-18)*2000;
  const fixed=S.prop.rent+staff+50000+35000+S.repay;
  exp+=fixed;R.money.push({k:'家賃・光熱・通信ほか',v:-(S.prop.rent+50000+35000)});
  R.money.push({k:'スタッフ人件費'+(S.members.length>18?'（会員が増えて増員）':''),v:-staff});
  if(S.repay)R.money.push({k:'借入の返済（'+Math.round(S.loan/10000)+'万円）',v:-S.repay});
  for(const k in OPT) if(S.opt[k]&&OPT[k].fix){exp+=OPT[k].fix;R.money.push({k:OPT[k].i+' '+OPT[k].n+' 運営費',v:-OPT[k].fix});}
  S.cash+=inc-exp;R.inc=inc;R.exp=exp;
  tickProjects(R);

  const pairs=adjacentPairs();
  S.members.forEach(m=>{
    m.months++;
    let d=(CM.score-50)/9-5.4+m.links*1.4+m.gt*0.55;
    if(m.cared)d+=7; if(m.joined)d+=4; if(m.seat)d+=2.5;
    if(m.inProject)d+=5;
    if(S.price.m>m.budget)d-=(S.price.m-m.budget)/900;   // 会費が高すぎる
    pairs.forEach(([a,b])=>{if(a===m||b===m)d+=affinity(a,b)*0.8;});
    if(m.traits.includes('right'))d-=2;
    if(m.traits.includes('care')||m.traits.includes('quiet'))d+=1.5;
    m.belong=cl(m.belong+d,0,100); m.cared=false; m.joined=false;
  });
  const out=[];
  S.members.forEach(m=>{
    let risk=0.02+(42-m.belong)/230+m.quiet*(S.density-0.4)*0.38-Math.min(m.links,3)*0.028;
    if(m.months<2)risk+=0.05;
    // 払える額を超えた会費は、そのまま退会理由になる
    if(S.price.m>m.budget)risk+=cl((S.price.m-m.budget)/6000,0,0.45);
    if(m.inProject)risk*=0.25;
    if(m.tier==='core')risk*=0.35;
    if(S.rules.includes('r3')&&m.traits.includes('right'))risk-=0.1;
    if(S.rules.includes('r4'))risk*=0.85;
    if(Math.random()<cl(risk,0.004,0.6))out.push(m);
  });
  out.forEach(m=>{S.members=S.members.filter(x=>x!==m);S.commons.bond-=0.8;
    news('× '+m.name+'（'+m.occ+'）が来なくなった'+(m.tier==='core'?'。コアの人だった':''));});
  R.left=out.length;

  let flow=0.7+S.commons.bridge/26+legitimacy()/46+S.marketing;
  for(const k in OPT) if(S.opt[k]) flow+=({cafe:1.3,kodomo:0.7,juku:0.8,kigyo:0.6,guest:1.0,event:0.9})[k];
  S.rules.forEach(id=>{const r=RULES.find(x=>x.id===id);if(r)flow+=r.in;});
  flow*=(0.35+S.openness*1.05);
  // 相場から離れるほど、そもそも人が来ない
  flow*=cl(1.25-Math.max(0,S.price.m-4000)/9000,0.35,1.35);
  const nf=Math.max(0,Math.round(flow+rnd(-.4,.4)));
  S.prospects+=nf;R.flow=nf;S.marketing=Math.max(0,S.marketing-0.7);
  const conv=cl(0.10+(CM.score-45)/260+S.openness*0.20+S.commons.bond/260,0.03,0.7);
  let joined=0;const tryN=S.prospects;
  for(let i=0;i<tryN;i++){if(S.members.length>=memberCap())break;
    if(Math.random()<conv){if(joinMember()){joined++;S.prospects--;}}}
  S.prospects=Math.max(0,S.prospects-Math.round(S.prospects*0.3));R.joined=joined;

  const before={core:T.core.length,mid:T.mid.length,edge:T.edge.length};
  S.members.forEach(m=>m.tier=tierOf(m)); reseat();
  const after=tiers();
  R.tier={before,after:{core:after.core.length,mid:after.mid.length,edge:after.edge.length}};

  const n=S.members.length;
  S.commons.bond  +=(CM.score-50)/13+after.core.length*0.35-n*0.06;
  S.commons.bridge+= nf*0.35-n*0.05;
  S.commons.link  +=(S.kodomoCount>0?0.5:0)+(S.opt.kigyo?0.6:0)-0.25;
  for(const k in S.commons)S.commons[k]=cl(S.commons[k],0,100);
  S.chaos=Math.max(0,S.chaos-1);

  const sk=skew();
  if(sk&&n>=5){
    if(sk==='moon'){S.commons.bridge-=2.2;news('月に偏っている：今月も、結局なにも決まらなかった');}
    if(sk==='earth'){S.hp-=2;news('地球に偏っている：ハウスルールの解釈で口論になっている');}
    if(sk==='sun'){S.hp-=2;S.commons.bond-=1.6;news('太陽に偏っている：先月の企画を、誰も片付けていない');}
    R.hp.push({k:'グループの偏り（'+G[sk].n+'）',v:-2});
  }
  fireEvents(R);

  if(n>=4){
    const avg=S.members.reduce((s,m)=>s+m.gt,0)/n;
    if(avg<-0.2){const d=Math.min(7,-avg*2.4);S.hp-=d;R.hp.push({k:'差し出す人より、受け取る人が多い',v:-d});}
    else if(avg>1.2){const g=Math.min(4,avg*1.4);S.hp+=g;R.hp.push({k:'差し出す人のほうが多い場になっている',v:g});}
  }
  const coreN=after.core.length;
  if(un===0&&S.care.length){S.hp+=3;S.commons.bond+=2;R.hp.push({k:'今月は、全部拾えた',v:3});}
  if(S.commons.bond>30&&Math.random()<0.55){const g=ri(3,6)+Math.min(coreN*0.5,5);S.hp+=g;
    R.hp.push({k:'名前を呼ばれ、礼を言われた',v:g});}
  if(S.rules.includes('r5')&&S.commons.bond>30&&Math.random()<0.55){const g=ri(2,4)+Math.min(coreN*0.3,3);S.hp+=g;
    R.hp.push({k:'会員に委ねられた',v:g});}
  const cN=S.members.filter(m=>m.traits.includes('care')&&m.tier!=='edge').length;
  if(cN){const g=Math.min(cN*2.2,7);S.hp+=g;R.hp.push({k:'世話焼きの人が肩代わりしてくれた',v:g});}
  if(S.rules.length>=3){const g=S.rules.length*0.9;S.hp+=g;R.hp.push({k:'ルールが、判断を肩代わりしてくれた',v:g});}
  if(n>26){const d=(n-26)*0.55;S.hp-=d;R.hp.push({k:'顔と名前が一致しない人がいる（'+n+'人）',v:-d});}

  /* ── メンタル ────────────────────────────────
     体力は動けば減る。メンタルは「報われたかどうか」で動く。振れ幅は体力より大きい */
  const profit=R.inc-R.exp;
  if(profit<0){
    // 開業してすぐ赤字なのは、織り込み済み。効いてくるのは後半
    const early=S.month<=4?0.4:1;
    const d=Math.min(13,(-profit/45000+1.5)*early); S.mp-=d;
    R.mp.push({k:S.month<=4?'赤字だが、まだ想定内':'今月も赤字だった',v:-d}); }
  else { const g=Math.min(9,profit/35000+2.5); S.mp+=g;
    R.mp.push({k:'黒字で終われた',v:g}); }
  if(S.chaos){ S.mp-=S.chaos*3.5; R.mp.push({k:'揉めごとを引きずっている',v:-S.chaos*3.5}); }
  if(R.left>=1){ S.mp-=R.left*2.5; R.mp.push({k:R.left+'人に辞められた',v:-R.left*2.5}); }
  // 抱える人数が増えるほど、気にかけることが増えていく
  if(S.members.length>14){ const d=Math.min(9,(S.members.length-14)*0.4);
    S.mp-=d; R.mp.push({k:'気にかける人が増えた（'+S.members.length+'人）',v:-d}); }
  if(S.mp<40){ S.mp-=3; R.mp.push({k:'よく眠れていない',v:-3}); }
  if(un===0&&S.care.length){ S.mp+=4; R.mp.push({k:'今月は、全部拾えた',v:4}); }
  if(after.core.length>=5&&S.commons.bond>34){ const g=Math.min(7,after.core.length*0.6);
    S.mp+=g; R.mp.push({k:'会員が、勝手に場を回してくれている',v:g}); }
  if(cN){ const g=Math.min(6,cN*2.5); S.mp+=g; R.mp.push({k:'支えてくれる人がいる',v:g}); }
  if(S.rules.includes('r5')&&S.commons.bond>30){ S.mp+=3; R.mp.push({k:'もめごとを任せられた',v:3}); }
  S.mp=cl(S.mp,0,S.mpMax);

  // メンタルが落ちると、体が言うことを聞かなくなる
  if(S.mp<50){ const d=(50-S.mp)*0.20; S.hp-=d;
    R.hp.push({k:S.mp<25?'朝、起きられない日がある':'気持ちが追いついていない',v:-d}); }

  S.hp=cl(S.hp,-20,S.hpMax);R.hpEnd=S.hp;R.mpEnd=S.mp;R.cashEnd=S.cash;S.lastReport=R;
  if(S.cash<0)S.ended='bankrupt';
  else if(S.mp<=0)S.ended='depression';
  else if(S.hp<=0)S.ended='burnout';
  else if(S.month>=12)S.ended=judge();
  // 経営が回ってスタッフが増えると、自分の手が空く
  const inc12=R.inc-R.exp;
  let apNext=12;
  if(S.staffUp||(inc12>80000&&S.cash>1200000&&S.month>=3)){
    if(!S.staffUp){S.staffUp=1;news('★ スタッフをもう1人雇えた。手が空くようになった（AP +3）');}
    apNext=15;
  }
  if(S.rules.includes('r9'))apNext+=1;
  if(!S.ended){S.month++;S.ap=apNext;S.news=[];S.care=genCare();}
  if(S.hp<25&&!S.ended)sfx('warn');
  showReport(R);
}

function fireEvents(R){
  const M=S.month;
  if(M===4&&!S.fired.hojo){S.fired.hojo=1;
    if(Math.random()<0.6){S.cash+=800000;S.commons.link+=4;news('★ 申請していた補助金が採択された。80万入った');}
    else news('補助金は不採択だった');}
  if(M>=6&&!S.fired.jutaku&&legitimacy()>=58){S.fired.jutaku=1;
    const v=S.opt.kigyo?800000:500000; S.cash+=v;S.hp-=8;S.commons.link+=8;
    news('★ 市の受託が決まった。'+Math.round(v/10000)+'万。会議が毎月増えた');}
  if(M===9&&!S.fired.rent&&S.prop.rent>0&&!S.fired.sell){S.fired.rent=1;
    if(legitimacy()>=62)news('大家から「これだけ地域でやってるんだから」と、家賃は据え置きになった');
    else{S.prop.rent=Math.round(S.prop.rent*1.3);news('家賃が30%上がった（'+yen(S.prop.rent)+'）');}}
  if(S.opt.kodomo&&Math.random()<cl(legitimacy()/140,0,.65)){
    const r=Math.random();
    if(r<.4){S.stock.veg+=ri(1,3);news('🎁 近所の農家が軽トラで野菜を積んできた。断れない');}
    else if(r<.7){S.stock.vol+=ri(1,2);news('🎁 近所の人が「ひまやから」と調理を買って出た');}
    else{S.stock.rice+=2;S.commons.link+=3;news('🎁 地元企業から米30kgが届いた。担当者が写真を撮りに来た');}}
  if(S.opt.cafe&&S.members.some(m=>m.traits.includes('right')&&m.tier!=='edge')&&Math.random()<.28){
    S.hp-=4;S.commons.bond-=1.5;news('「お金を払っているのに」と、長いクレームを受けた');
    R.hp.push({k:'クレーム対応',v:-4});}
  if(legitimacy()>=70&&!S.fired.media&&Math.random()<.45){S.fired.media=1;S.marketing+=1.8;S.commons.link+=3;news('★ 地元紙の取材が来た');}
  const corpP=(S.opt.kigyo?.6:.42)+S.done*0.06, corpMax=(S.opt.kigyo?6:4)+Math.floor(S.done/2);
  if(S.commons.link>=15&&S.corp<corpMax&&Math.random()<corpP){S.corp++;news('★ 法人契約が1社決まった');}
  if(S.opt.virt){const room=Math.round(10+legitimacy()/7+S.commons.link/3.5);
    if(S.virtN<room&&Math.random()<.85){const n=ri(1,3);S.virtN+=n;news('住所貸しの契約が'+n+'件増えた（計'+S.virtN+'件）');}}
  if(S.opt.guest&&M===7&&!S.fired.gh){S.fired.gh=1;S.commons.bridge+=5;news('★ 泊まった人が、そのまま移住を検討しはじめた');}
}
function judge(){
  const L=legitimacy(),J=jisou();
  const v=VISIONS[S.vision].ok(S);
  // 自走とは「会員同士が、あなた抜きで何かを成し遂げた」こと
  if(v&&J>=78&&S.rules.length>=4&&S.done>=3&&S.mp>=55)return 'true';
  if(v)return 'vision';
  if(S.commons.bond>36&&S.commons.bridge<30&&L<66)return 'inner';
  if(S.edges<=3&&tiers().core.length<=3)return 'stranger';
  return 'survive';
}
/* 総合評価：ビジョンへの近さ・コモンズ・企画・経営・体力 */
function scoreAll(){
  const V=VISIONS[S.vision], c=S.commons;
  const vis=V.ok(S)?100:cl(V.prog?V.prog(S):50,0,95);
  const com=cl((c.bond+c.bridge+c.link*1.4)/2.6,0,100);
  const prj=cl(S.done*22+S.projects.length*6,0,100);
  const biz=cl(S.cash/40000,0,100);
  const hp =cl((S.hp+S.mp)/2,0,100);   // 体力と気持ちの両方
  const total=vis*0.30+com*0.26+prj*0.16+biz*0.10+hp*0.18;
  return {vis,com,prj,biz,hp,total};
}

function floorCard(CM){
  const n=S.members.length,T=tiers();

  const sk=skew();
  let zones='';
  ZONES.forEach(z=>{
    let s='';
    for(let i=0;i<z.seats;i++){
      const k=z.id+':'+i,m=memberAt(k);
      if(m){const hm=hasMatch(m);
        s+=`<div class="seat ${MOVE===m.id?'sel':''} ${hm>=7?'match':''}" onclick="clickSeat('${k}')">
          ${hm>=7?'<div class="spark">✦</div>':''}

    zones+=`<div class="zone"><h4>${z.n}</h4><div class="seats">${s}</div></div>`;
  });
  const pct=x=>n?Math.round(x/n*100):0;
  const others=T.mid.concat(T.edge);
  return `<div class="card">
    <div class="hd"><h2>フロア</h2>
      <span class="sm" style="color:${MOVE?'var(--acc)':'var(--dim)'}">${MOVE?'移動先の席を選んでください':'席をクリックすると、その人のカードが開きます'}</span></div>

      <div style="flex:${Math.max(T.edge.length,0.4)};background:var(--edge)">周辺 ${T.edge.length}</div>
    </div>

    <div class="sm" style="margin-bottom:6px">
      <span style="color:var(--moon)">🌙月 ${cnt.moon}</span>　<span style="color:var(--earth)">🌍地球 ${cnt.earth}</span>　<span style="color:var(--sun)">☀太陽 ${cnt.sun}</span>
      ${sk?`<span class="tag" style="border-color:var(--warn);color:var(--warn)">${G[sk].n}に偏っています（${pct(cnt[sk])}%）</span>`:''}</div>

    ${others.length?`<div class="zone"><h4>今日は来ていない会員　<span style="text-transform:none">${others.length}人</span></h4>

/* ---------- 席の操作 ---------- */
function clickSeat(key){
  const m=memberAt(key);
  if(MOVE){
    const sel=S.members.find(x=>x.id===MOVE);
    if(!sel){MOVE=null;render();return;}
    if(sel.seat===key){MOVE=null;render();return;}
    confirmMove(sel,m,key); return;
  }
  if(m)showMember(m.id);
}
function confirmMove(sel,other,key){
  if(S.ap<1){toast('APが足りません');MOVE=null;render();return;}
  const zn=ZONES.find(z=>z.id===key.split(':')[0]).n;
  modal(`<h2>席を移しますか？</h2><hr class="hr">
   <div class="bd"><span>${esc(sel.name)}</span><span>→ <b>${zn}</b></span></div>
   ${other?`<div class="bd"><span>${esc(other.name)}</span><span>と入れ替わります</span></div>`:''}
   <div class="bd"><span>コスト</span><span class="neg">AP 1</span></div>
   <div class="opts" style="margin-top:14px">
     <button class="pri" style="flex:1" onclick="doMove('${sel.id}','${other?other.id:''}','${key}')">移す</button>
     <button style="flex:1" onclick="MOVE=null;closeModal()">やめる</button></div>`);
}
function doMove(selId,otherId,key){
  const sel=S.members.find(m=>m.id===selId),other=otherId?S.members.find(m=>m.id===otherId):null;
  S.ap-=1;S.hp-=1; sfx('tap'); const from=sel.seat;
  if(other){other.seat=from;sel.seat=key;news(sel.name+'と'+other.name+'の席を入れ替えた');}
  else{sel.seat=key;news(sel.name+'の席を移した');}
  MOVE=null;closeModal();
}
function showMember(id){
  const m=S.members.find(x=>x.id===id); if(!m)return;
  const g=G[m.group],tn={core:'コア層',mid:'中間層',edge:'周辺層'}[m.tier];
  const tc={core:'var(--core)',mid:'var(--mid)',edge:'var(--edge)'}[m.tier];
  const gtM=mk(m.gt);
  modal(`<h2>${esc(m.name)}</h2>
   <div class="dim sm">在籍${m.months}ヶ月　つながり${m.links}本　　話を聞いた回数 ${talkDots(m)}</div><hr class="hr">
   <div class="bd"><span>来店頻度</span><span><span class="dot" style="background:${tc}"></span><b>${tn}</b></span></div>
   <div class="bd"><span>仕事</span><span>${esc(m.occ)}${m.phase&&m.phase!=='―'?'　<span class="dim">'+esc(m.phase)+'</span>':''}</span></div>
   <div class="bd"><span>働き方</span><span>${m.quiet>=.6?'静かに集中したい':m.quiet>=.35?'場に合わせる':'みんなと話したい'}</span></div>
   <div class="bd"><span>性格</span><span style="text-align:right">${m.traits.map(t=>
     `<span class="tag" style="${TR[t].bad?'border-color:var(--warn);color:var(--warn)':''}">${TR[t].n}</span>`).join('')}</span></div>
   <div class="bd"><span>タイプ</span><span>${m.revealed>=1?`<span class="dot" style="background:${g.c}"></span><b>${g.n}</b>（${g.ax}）`:'<span class="dim">？</span>'}</span></div>
   <div class="bd"><span>やりたいこと</span><span style="text-align:right">${m.revealed>=2?`<b>${esc(m.want.t)}</b><br><span class="xs dim">要 ${m.want.need.map(t=>TAG[t]).join('・')}</span>`:'<span class="dim">？</span>'}</span></div>
   <div class="bd"><span>できること</span><span style="text-align:right">${m.revealed>=3?(m.offer.length?m.offer.map(t=>TAGI[t]+' '+OFFER[t]).join('<br>'):'<span class="dim">特にない、と言う</span>'):'<span class="dim">？</span>'}</span></div>
   <div class="bd"><span>貢献意欲</span><span class="mk" style="color:${gtM[1]}">${gtM[0]}</span></div>
   ${m.inProject?`<div class="bd"><span>いま</span><span>企画に参加中</span></div>`:''}
   <hr class="hr">
   <div class="opts">
     ${m.tier==='core'?`<button class="pri" style="flex:1" onclick="startMove('${m.id}')">席を移動する（AP1）</button>`
       :`<div class="xs dim" style="flex:1">この人は今日、席にいません。</div>`}
     <button onclick="closeModal()">閉じる</button></div>`);
}
function startMove(id){MOVE=id;closeModal();}
function talkDots(m){ let s='';
  for(let i=0;i<3;i++) s+=`<span class="dot" style="background:${i<m.revealed?'var(--acc)':'var(--line)'}"></span>`;
  return s; }
function doCare(i,j){
  const c=S.care[i];if(c.done)return;
  const o=c.o[j]; if(S.ap<o.ap){toast('AP不足');return;}
  const cost=o.hp?o.hp+1:0;                     // 気配りは、思っているより削る
  S.ap-=o.ap;S.hp-=cost;sfx(cost>=4?'warn':'care');
  const before=S.news.length;
  o.f();
  // 何が起きたか必ず残す。「やった意味があったのか」が分からないのが一番きつい
  if(S.news.length===before)
    news(o.r ? (typeof o.r==='function'?o.r():o.r)
             : c.t.replace(/。$/,'')+' → '+o.l);
  c.done=true;c.chosen=o.l;render();
}
function setVal(p,v){v=parseFloat(v);if(p.startsWith('price.'))S.price[p.split('.')[1]]=v;else S[p]=v;render();}
function addOpt(k){
  const cost=k==='virt'?200000:OPT[k].cost;
  if(S.cash<cost){toast('現金が足りません（'+yen(cost)+'必要）');return;}
  S.cash-=cost;S.opt[k]=true;S.hp-=(k==='virt'||k==='kigyo'?1:4);
  news((k==='virt'?'📮 住所貸し':OPT[k].i+' '+OPT[k].n)+'をはじめた');render();
}

function pickIdx(i){const l=window.__l,f=CB;closeModal();if(f)f(l[i]);}

/* つなぐ相手選び：噛み合いが見える */
function chooseMatch(a){
  // 相手のことが分かっていないと、噛み合うかどうかも分からない
  const cand=S.members.filter(b=>b!==a&&!b.inProject&&b.revealed>=1)
    .map(b=>({b,v:matchScore(a,b)})).sort((x,y)=>y.v-x.v).slice(0,10);
  if(!cand.length){ toast('つなげる相手がまだいません。\n他の会員の話も聞いてみてください'); return; }
  window.__l=cand.map(x=>x.b); CB=b=>doConnect(a,b);
  const known=a.revealed>=2;
  modal(`<div class="dim sm">${esc(a.name)}（${esc(a.occ)}）</div>
   <h2 style="margin:4px 0 8px">${known?'「'+esc(a.want.t)+'」':'この人のやりたいことは、まだ分からない'}</h2>
   ${known?`<div class="sm dim">必要なのは ${a.want.need.map(t=>'<span class="tag">'+TAG[t]+'</span>').join('')}</div>`
     :`<div class="note sm">「話を聞く」を2回すると、この人が何をしたいのか分かります。<br>分からないまま繋いでも、うまくいくとは限りません。</div>`}
   <hr class="hr">
   ${cand.map((x,i)=>{const b=x.b, m=mkMatch(x.v), known=b.revealed>=2;
     const off=b.revealed>=3?b.offer.map(t=>TAGI[t]+' '+OFFER[t]).join('　')
       :(known?'できることは、まだ聞けていない':'この人のことは、ほとんど分かっていない');
     const hit=known&&a.revealed>=2?a.want.need.filter(t=>b.offer.includes(t)):[];
     return `<button class="pick ${x.v>=7?'match':''}" style="${known?'':'opacity:.55'}" onclick="pickIdx(${i})">
       <b>${esc(b.name)}</b> <span class="dim sm">${esc(b.occ)}</span>
       <span style="float:right">${talkDots(b)}　<span class="mk" style="color:${m[1]}">${m[0]}</span></span>
       <i style="display:block;font-style:normal" class="xs ${known?'':'dim'}">${esc(off)}</i>
       ${hit.length?`<i style="display:block;font-style:normal;color:var(--good)" class="xs">
         ✦ ${hit.map(t=>TAG[t]).join('・')} が噛み合います</i>`:''}</button>`;}).join('')}
   <div class="xs dim" style="margin:6px 0">薄く表示されている人は、まだ話を聞けていない人です。</div>
   <button onclick="closeModal()" style="width:100%;margin-top:8px">やめる</button>`);
}
function mkMatch(v){ return v>=7?['◎','var(--good)']:v>=4?['○','var(--good)']:v>=2?['△','var(--warn)']:['×','var(--bad)']; }
function doConnect(a,b){
  S.ap-=2;S.hp-=1;
  const v=matchScore(a,b), aff=affinity(a,b);
  let icon,head,body,tone;
  if(v>=4 && a.revealed>=2){
    const p=startProject(a,b);
    icon='🌱';tone='var(--good)';head='企画が動き出しました';
    body=`「${p.t}」に ${b.name} が加わりました。<br>あと ${p.need} ヶ月ほどで形になります。`;
  } else if(v>=2||aff>0.3){
    S.edges++;a.links++;b.links++;a.belong+=10;b.belong+=10;
    S.commons.bridge+=3;S.commons.bond+=2; sfx('good');
    news('○ '+a.name+'と'+b.name+'がつながった');
    icon='🤝';tone='var(--good)';head='つながりました';
    body='2人は話が弾んでいます。企画にはなりませんでしたが、関係はできました。';
  } else if(aff>-1.5){
    S.commons.bridge+=0.6;a.belong+=3;b.belong+=3;
    news('― '+a.name+'と'+b.name+'を引き合わせた。特に何も起きなかった');
    icon='😐';tone='var(--dim)';head='何も起きませんでした';
    body=`${b.name} は、${a.name} が必要としているものを持っていませんでした。<br>`
      +(b.revealed<3?'相手のことをもっと知ってから繋ぐと、うまくいきやすくなります。'
                    :'噛み合うものを持っている人を探してみてください。');
  } else {
    S.hp-=3;S.commons.bond-=2.6;a.belong-=8;b.belong-=8; sfx('bad');
    news('× '+a.name+'と'+b.name+'は、合わなかった');
    icon='💥';tone='var(--bad)';head='失敗しました';
    body='この2人は、そもそも相性が良くありませんでした。<br>気まずい空気になり、2人とも足が遠のいています。';
  }
  modal(`<div style="text-align:center">
    <div style="font-size:40px">${icon}</div>
    <h2 style="margin:6px 0 10px;color:${tone}">${head}</h2></div>
   <div class="note">${body}</div>
   <div class="bd" style="margin-top:10px"><span>${esc(a.name)}</span>
     <span class="xs dim">${a.revealed>=2?'「'+esc(a.want.t)+'」':'やりたいことは未確認'}</span></div>
   <div class="bd"><span>${esc(b.name)}</span>
     <span class="xs dim">${b.revealed>=3?b.offer.map(t=>TAGI[t]+OFFER[t]).join('　'):'できることは未確認'}</span></div>
   <div style="margin-top:14px"><button class="pri" style="width:100%;padding:10px" onclick="closeModal()">閉じる</button></div>`);
}
