<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>拡充の一年｜一般社団法人リズカーレ 活動報告</title>
<meta name="description" content="一般社団法人リズカーレの年次活動報告（寄付者限定）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --paper: #EAEDE9;
    --surface: #FFFFFF;
    --sunk: #E3E8E3;
    --ink: #1C2A26;
    --ink-soft: #55665F;
    --rule: #C6D0C9;
    --ai: #2C6E63;
    --signal: #B0761C;
    --display: "Zen Old Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121A18;
      --surface: #1A2522;
      --sunk: #16201D;
      --ink: #E7EDEA;
      --ink-soft: #A2B3AC;
      --rule: #2F423C;
      --ai: #79BFB0;
      --signal: #D9A455;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121A18;
    --surface: #1A2522;
    --sunk: #16201D;
    --ink: #E7EDEA;
    --ink-soft: #A2B3AC;
    --rule: #2F423C;
    --ai: #79BFB0;
    --signal: #D9A455;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 0 72px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    color: var(--ai);
  }
  .mincho { font-family: var(--display); }

  /* ---------- gate ---------- */
  [hidden] { display: none !important; }
  .gate {
    min-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .gate-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 32px 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .gate-card h1 {
    margin: 0;
    font-family: var(--display);
    font-size: 24px;
    font-weight: 700;
    line-height: 1.5;
  }
  .gate-card p { font-size: 14.5px; color: var(--ink-soft); line-height: 1.8; }
  .gate-form { display: flex; gap: 8px; }
  .gate-form input {
    flex: 1;
    min-width: 0;
    font-family: var(--body);
    font-size: 16px;
    padding: 10px 12px;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--rule);
  }
  .gate-form button {
    font-family: var(--body);
    font-size: 15px;
    font-weight: 700;
    color: var(--surface);
    background: var(--ai);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
  }
  .gate-form button:hover { opacity: .9; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .gate-error { font-size: 14px; color: var(--signal); }

  /* ---------- hero ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-block: 52px 36px;
  }
  .limited {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--signal);
    border: 1px solid var(--signal);
    padding: 4px 10px;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(32px, 9vw, 50px);
    line-height: 1.3;
    letter-spacing: .02em;
    text-wrap: balance;
  }
  .hero h1 em { font-style: normal; color: var(--ai); }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    align-items: baseline;
    font-size: 14px;
    color: var(--ink-soft);
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }
  .hero-meta strong { color: var(--ink); font-weight: 700; }
  .hero-meta .period { font-family: var(--mono); font-size: 13px; }
  .lede { font-size: 16.5px; }

  /* ---------- members ---------- */
  .members {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 24px 22px;
    margin-block: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .members-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .member-num {
    font-family: var(--display);
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .member-num small { font-size: 16px; margin-left: 3px; }
  .member-num.peak { color: var(--ink-soft); font-size: 28px; }
  .member-num.now { color: var(--ai); }
  .member-arrow { color: var(--ink-soft); font-size: 15px; }
  .members-cap { font-size: 14.5px; color: var(--ink-soft); }
  .members-note { font-size: 15.5px; }

  /* ---------- chapters ---------- */
  .chapter { padding-block: 36px; border-top: 1px solid var(--rule); }
  .chapter-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .chapter h2 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 700;
    line-height: 1.45;
    text-wrap: balance;
  }
  .chapter-sub { font-size: 14.5px; color: var(--ink-soft); }
  .body-text { display: flex; flex-direction: column; gap: 16px; font-size: 15.5px; }
  .body-text strong { font-weight: 700; }

  /* ---------- club list ---------- */
  .clubs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-block: 4px;
  }
  .clubs li {
    font-size: 14px;
    line-height: 1.6;
    border: 1px solid var(--rule);
    background: var(--surface);
    padding: 5px 12px;
  }
  .clubs li.rest { color: var(--ink-soft); border-style: dashed; }

  /* ---------- loop ---------- */
  .loop {
    margin-block: 6px;
    padding: 22px 20px;
    background: var(--sunk);
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .loop-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--ai);
    margin-bottom: 14px;
  }
  .loop-step {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 12px;
    align-items: start;
    font-size: 15px;
  }
  .loop-step i {
    font-style: normal;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ai);
    border: 1px solid var(--ai);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    margin-top: 5px;
  }
  .loop-link {
    height: 16px;
    margin-left: 10px;
    border-left: 1px solid var(--rule);
  }
  .loop-back {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--rule);
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* ---------- figure block ---------- */
  .figure {
    margin-block: 6px;
    border: 1px solid var(--rule);
    background: var(--surface);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .figure b {
    font-family: var(--display);
    font-size: 36px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--signal);
    font-variant-numeric: tabular-nums;
  }
  .figure b small { font-size: 16px; margin-left: 3px; }
  .figure span { font-size: 14px; color: var(--ink-soft); }

  /* ---------- case ---------- */
  .case {
    margin-top: 8px;
    border-left: 3px solid var(--ai);
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .case h3 {
    margin: 0;
    font-family: var(--display);
    font-size: 17.5px;
    font-weight: 700;
    line-height: 1.5;
  }
  .case p { font-size: 15px; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { display: grid; grid-template-columns: 64px 1fr; gap: 12px; font-size: 15px; align-items: start; }
  .step i {
    font-style: normal;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    text-align: center;
    padding: 4px 0;
    margin-top: 4px;
  }
  .step.turn i { color: var(--signal); border-color: var(--signal); }

  /* ---------- quiet section ---------- */
  .quiet {
    background: var(--sunk);
    border-top: none;
    padding-inline: 20px;
    margin-inline: -20px;
  }
  .pull {
    font-family: var(--display);
    font-size: 18px;
    line-height: 1.8;
    color: var(--ai);
    border-left: 2px solid var(--ai);
    padding-left: 16px;
  }
  .pull small { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

  /* ---------- next ---------- */
  .next-block { display: flex; flex-direction: column; gap: 18px; }
  .next-item {
    border: 1px solid var(--rule);
    background: var(--surface);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .next-item h3 {
    margin: 0;
    font-family: var(--display);
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
  }
  .next-item p { font-size: 15px; }
  .tag {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    color: var(--ai);
    border: 1px solid var(--ai);
    padding: 3px 8px;
  }

  /* ---------- column / footer ---------- */
  .column {
    margin-top: 44px;
    padding: 30px 24px;
    background: var(--surface);
    border-top: 3px solid var(--ai);
    border-bottom: 1px solid var(--rule);
  }
  .column .chapter-head { margin-bottom: 22px; }
  .column-body {
    display: flex;
    flex-direction: column;
    gap: 17px;
    font-size: 15.5px;
  }
  .column-body p:first-of-type {
    font-family: var(--display);
    font-size: 17px;
    line-height: 1.85;
  }
  .sign {
    margin-top: 6px;
    text-align: right;
    font-family: var(--display);
    font-size: 15px;
  }
  footer {
    margin-top: 32px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  footer strong { font-family: var(--display); font-size: 16px; color: var(--ink); }
  .handle { font-size: 12.5px; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise .5s ease-out both; }
    @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>

  var KEY = "risicare-report-2026";
  var gate = document.getElementById("gate");
  var doc = document.getElementById("doc");
  var form = document.getElementById("gate-form");
  var pass = document.getElementById("pass");
  var err = document.getElementById("gate-error");

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function unlock(phrase) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(phrase.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.ct));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    doc.innerHTML = html;
    gate.hidden = true;
    document.title = "拡充の一年｜一般社団法人リズカーレ 活動報告";
  }

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) unlock(saved).then(show).catch(function () { localStorage.removeItem(KEY); });
  } catch (e) {}

  if (!(window.crypto && crypto.subtle)) {
    err.textContent = "このブラウザでは開けません。Safari や Chrome の最新版でお試しください。";
    err.hidden = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true;
    unlock(pass.value || "").then(function (html) {
      show(html);
      window.scrollTo(0, 0);
      try { localStorage.setItem(KEY, pass.value); } catch (e2) {}
    }).catch(function () {
      err.hidden = false;
      pass.value = "";
      pass.focus();
    });
  });
